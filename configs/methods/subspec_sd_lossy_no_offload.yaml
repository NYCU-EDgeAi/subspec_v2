# SubSpec SD (v1, no offload) + lossy verification. Inherits subspec_sd_no_offload.yaml;
# only draft depth and the verifier differ.
extends: subspec_sd_no_offload.yaml

draft_params:
  max_depth: 48

generator_kwargs:
  verify_method: lossy
  verify_kwargs:
    threshold_method: entropy
    threshold: 0.3
    window_size: 6
