# SubSpec SD (v1) + lossy verification. Inherits the exact config from subspec_sd.yaml;
# only the verifier (and its larger prefill chunk) differ.
extends: subspec_sd.yaml

generator_kwargs:
  prefill_chunk_size: 4096
  verify_method: lossy
  verify_kwargs:
    # entropy (paper): accept a non-matching child when normalized entropy < threshold.
    threshold_method: entropy
    threshold: 0.3
    # Require at least this many future locally-correct nodes (lookahead).
    window_size: 6
