# SubSpec SD FlashInfer v3 config
# Based on working v1 implementation with clean code structure
# Key improvement: CUDA graphs captured lazily inside speculate() - no external init needed
method: subspec_sd_fi3

llm_path: Qwen/Qwen3-8B

recipe:
  class_path: specdecodes.helpers.recipes.subspec.hqq_4bit_postspec:Recipe

max_length: 4096
cache_implementation: static
warmup_iter: 1
compile_mode: max-autotune-no-cudagraphs

# Target sampling settings (defaults)
do_sample: false
temperature: 0

generator_profiling: true

generator_kwargs:
  prefill_chunk_size: 128
  verify_method: exact
  verify_kwargs: {}

draft_params:
  temperature: 0.2
  max_depth: 32
  topk_len: 6
